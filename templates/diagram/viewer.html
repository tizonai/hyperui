*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

.t-primary { fill: var(--text); font-weight: 600; }
.t-muted { fill: var(--muted); font-size: 10px; }

.e-emphasis .line { stroke: var(--accent); stroke-width: 2.5; }
.e-security .line { stroke: var(--security-stroke); }

.diagram.has-focus .group { opacity: .55; }
.node.is-near .c-box { stroke-width: 2.5; }
