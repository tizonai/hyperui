<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!--
  hyperui spec page template. Filled by scripts/spec-page.py (markdown in, page out); every
  double-brace placeholder (named below without the braces, so a literal replace never touches this
  comment) is replaced and nothing else changes. The script emits a FRAGMENT by default (title, meta
  description, style, body content) because the Artifact tool wraps it in the document skeleton;
  --full keeps this whole document for the no-Artifact fallback file. Artifact contract kept here:
  colors as tokens on :root, dark mode under prefers-color-scheme guarded by :root:not([data-theme="light"])
  and again under :root[data-theme="dark"], explicit body background, 16px side gutter, no horizontal
  scroll at phone width, Mermaid from jsdelivr pinned to an exact version.
    lang         BCP-47 tag of the spec's language (es, en, …)
    title        "<Topic> — PRD" | "<Topic> — Spec" | "Spec: <Topic>" — a name of 2–4 words; the
                 explanation goes in description
    description  one sentence for the artifact card
    status       draft | in review | approved
    date         YYYY-MM-DD        track  SDD-lite | full · <phase>
    root         repo root path    approvals  e.g. "PRD ✓ · Requirements ✓ · Design — · Tasks —"
    toc          <li><a href="#id">…</a></li> items, one per h2 in sections
    sections     the markdown already converted to HTML (see spec-artifacts.md)
  Mermaid: write each diagram as <pre class="mermaid">…</pre>; it is rendered client side.
-->
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #efede7; --text: #1b1a17; --muted: #5f5c55;
    --accent: #b4520f; --accent-ink: #ffffff; --border: #dcd9d0; --code-bg: #f0ede6;
    --ok: #1e7d4f; --warn: #a66a00; --shadow: 0 1px 2px rgba(20, 18, 12, .06), 0 8px 24px rgba(20, 18, 12, .06);
    --radius: 12px; --measure: 72ch;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141311; --surface: #1d1c19; --surface-2: #26241f; --text: #ece9e1; --muted: #a39f94;
      --accent: #f0945a; --accent-ink: #1b1a17; --border: #33302a; --code-bg: #23211c;
      --ok: #5fcf93; --warn: #e5b04a; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141311; --surface: #1d1c19; --surface-2: #26241f; --text: #ece9e1; --muted: #a39f94;
    --accent: #f0945a; --accent-ink: #1b1a17; --border: #33302a; --code-bg: #23211c;
    --ok: #5fcf93; --warn: #e5b04a; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 17px; line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .page { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }

  /* Header card */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin: 24px 0;
  }
  .card h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 1.1rem + 1.8vw, 2.25rem); line-height: 1.15; letter-spacing: -.01em; }
  .card .lede { margin: 0 0 14px; color: var(--muted); }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; margin: 0; }
  .meta div { min-width: 0; }
  .meta dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .meta dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600;
            border: 1px solid var(--border); background: var(--surface-2); text-transform: capitalize; }
  .status[data-status="approved"] { color: var(--ok); border-color: currentColor; }
  .status[data-status="draft"], .status[data-status="in review"] { color: var(--warn); border-color: currentColor; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 16px; }
  .brand { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
  .theme-btn { font: inherit; font-size: .85rem; color: var(--text); background: var(--surface); border: 1px solid var(--border);
               border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--accent); }

  /* Layout: sticky TOC on wide screens */
  .layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .toc { position: static; }
  .toc details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
  .toc summary { cursor: pointer; font-weight: 600; }
  .toc ol { margin: 10px 0 4px; padding-left: 20px; }
  .toc li { margin: 4px 0; }
  .toc a { color: var(--text); text-decoration: none; }
  .toc a:hover, .toc a.active { color: var(--accent); }
  @media (min-width: 960px) {
    .layout { grid-template-columns: 240px minmax(0, 1fr); align-items: start; }
    .toc { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
    .toc details { border: 0; background: transparent; padding: 0; }
    .toc summary { list-style: none; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: default; }
    .toc summary::-webkit-details-marker { display: none; }
    .toc ol { list-style: none; padding-left: 0; border-left: 1px solid var(--border); }
    .toc li a { display: block; padding: 4px 12px; margin-left: -1px; border-left: 2px solid transparent; font-size: .92rem; }
    .toc li a.active { border-left-color: var(--accent); }
  }

  /* Content */
  .content { min-width: 0; }
  .content > section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                       padding: 8px 20px 20px; margin-bottom: 20px; }
  .content h2 { font-size: 1.45rem; margin: 16px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 16px; }
  .content h3 { font-size: 1.12rem; margin: 22px 0 6px; }
  .content h4 { font-size: 1rem; margin: 18px 0 4px; color: var(--muted); }
  .content p, .content ul, .content ol { max-width: var(--measure); }
  .content li { margin: 4px 0; }
  .content li > input[type="checkbox"] { margin: 0 8px 0 0; accent-color: var(--accent); vertical-align: -1px; }
  .content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
  .content blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--surface-2); color: var(--muted); border-radius: 0 8px 8px 0; }
  .content hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  code, kbd { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
  pre code { background: none; padding: 0; font-size: .85rem; }
  pre.mermaid { background: var(--surface-2); text-align: center; overflow-x: auto; }
  pre.mermaid svg { max-width: 100%; height: auto; }
  .caption { font-size: .9rem; color: var(--muted); text-align: center; margin: -6px 0 14px; }
  .table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .93rem; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .na { color: var(--muted); font-style: italic; }
  .footer { margin-top: 32px; font-size: .85rem; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  @media print {
    :root { --bg: #fff; --surface: #fff; --shadow: none; }
    body { font-size: 11pt; }
    .toc, .theme-btn, .footer { display: none !important; }
    .layout { display: block; }
    .card, .content > section { border: 0; box-shadow: none; padding: 0; margin: 0 0 16pt; break-inside: avoid; }
    .content h2 { break-after: avoid; }
    pre, table, .table-wrap { break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: .85em; color: #555; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="card">
    <h1>{{title}}</h1>
    <p class="lede">{{description}}</p>
    <dl class="meta">
      <div><dt>Status</dt><dd><span class="status" data-status="{{status}}">{{status}}</span></dd></div>
      <div><dt>Date</dt><dd>{{date}}</dd></div>
      <div><dt>Track</dt><dd>{{track}}</dd></div>
      <div><dt>Repo root</dt><dd><code>{{root}}</code></dd></div>
      <div><dt>Approvals</dt><dd>{{approvals}}</dd></div>
    </dl>
    <div class="toolbar">
      <span class="brand">hyperui · spec</span>
      <button class="theme-btn" type="button" id="theme" aria-pressed="false">Dark mode</button>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" aria-label="Contents">
      <details open>
        <summary>Contents</summary>
        <ol>
          {{toc}}
        </ol>
      </details>
    </nav>

    <main class="content">
      {{sections}}
    </main>
  </div>

  <p class="footer">Source of truth: the markdown in <code>.hyperui/spec/</code>. This page is regenerated on every revision.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('theme');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : mq.matches;
  }
  function apply(theme) {
    if (theme) { root.setAttribute('data-theme', theme); }   // null = keep the attribute the page shipped with
    var dark = isDark();
    btn.textContent = dark ? 'Light mode' : 'Dark mode';
    btn.setAttribute('aria-pressed', String(dark));
    try { if (window.mermaid) { renderMermaid(dark); } } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('hyperui-spec-theme'); } catch (e) {}
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('hyperui-spec-theme', next); } catch (e) {}
    apply(next);
  });

  // Mermaid: keep the raw source so the diagram can be re-rendered when the theme flips.
  var blocks = Array.prototype.slice.call(document.querySelectorAll('pre.mermaid'));
  blocks.forEach(function (b, i) { b.dataset.src = b.textContent; b.id = b.id || 'mmd-' + i; });
  function renderMermaid(dark) {
    if (!blocks.length) return;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict' });
    blocks.forEach(function (b) {
      b.removeAttribute('data-processed');
      b.textContent = b.dataset.src;
    });
    mermaid.run({ nodes: blocks }).catch(function () {});
  }

  apply(saved);
  if (!saved) { mq.addEventListener('change', function () { apply(null); }); }

  // Highlight the current section in the TOC.
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  var targets = links.map(function (a) { return document.getElementById(decodeURIComponent(a.hash.slice(1))); });
  if ('IntersectionObserver' in window && targets.some(Boolean)) {
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) current = e.target; });
      links.forEach(function (a, i) { a.classList.toggle('active', targets[i] === current); });
    }, { rootMargin: '-10% 0px -70% 0px' });
    targets.forEach(function (t) { if (t) io.observe(t); });
  }
})();
</script>
</body>
</html>
